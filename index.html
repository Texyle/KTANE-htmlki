<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Модули</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0d0f13;
    --bg-glow: radial-gradient(1200px 600px at 50% -10%, #1b2333 0%, transparent 60%);
    --fg: #e7eaf0;
    --muted: #8b93a3;
    --card: #161a21;
    --card-hover: #1b202a;
    --border: #262b35;
    --border-hover: #3b4250;
    --accent: #6ea0ff;
    --accent-soft: rgba(110,160,255,.14);
    --shadow: 0 1px 2px rgba(0,0,0,.6), 0 18px 40px -22px rgba(0,0,0,.9);
    --radius: 14px;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  html, body { min-height: 100%; }

  body {
    margin: 0;
    padding: clamp(1.5rem, 4vw, 3.5rem) clamp(1rem, 4vw, 2rem);
    background-color: var(--bg);
    background-image: var(--bg-glow);
    background-repeat: no-repeat;
    background-attachment: fixed;
    color: var(--fg);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  /* ── Шапка ───────────────────────────────────────────────── */
  header { margin-bottom: 1.5rem; }
  h1 {
    margin: 0 0 .35rem;
    font-size: clamp(1.4rem, 3vw, 1.9rem);
    font-weight: 650;
    letter-spacing: -.02em;
    background: linear-gradient(180deg, #ffffff, #b9c4d6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .muted { margin: 0; color: var(--muted); font-size: .875rem; }
  #where {
    margin-top: .15rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .78rem;
    opacity: .75;
  }

  /* ── Поиск ───────────────────────────────────────────────── */
  .search {
    width: 100%;
    margin: 0 0 1rem;
    padding: .7rem .95rem;
    font: inherit;
    font-size: .95rem;
    color: inherit;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    transition: border-color .15s, box-shadow .15s, background-color .15s;
  }
  .search::placeholder { color: var(--muted); }
  .search:hover { border-color: var(--border-hover); }
  .search:focus {
    outline: none;
    background: var(--card-hover);
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  /* ── Сетка панелей ───────────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: .7rem;
    margin: 0;
    padding: 0;
    list-style: none;
  }
  .grid > li { min-width: 0; }

  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: center;
    height: 100%;
    min-height: 62px;
    padding: .8rem 1rem;
    color: inherit;
    text-decoration: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color .15s, box-shadow .15s, transform .15s, background-color .15s;
  }
  /* Тонкая светящаяся полоска слева */
  .card::before {
    content: '';
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: linear-gradient(180deg, var(--accent), transparent);
    opacity: 0;
    transition: opacity .15s;
  }
  .card:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    box-shadow: var(--shadow);
    transform: translateY(-2px);
  }
  .card:hover::before { opacity: 1; }
  .card:active { transform: translateY(0); }
  .card:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .card__title {
    font-size: .95rem;
    font-weight: 550;
    letter-spacing: -.01em;
    overflow-wrap: anywhere;
  }
  .card__path {
    margin-top: .15rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: .75rem;
    color: var(--muted);
    overflow-wrap: anywhere;
  }

  .empty { margin: 1rem 0 0; color: var(--muted); font-size: .9rem; }
  .err { color: #ff8a9b; white-space: pre-wrap; }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Модули</h1>
      <p class="muted" id="status">Загрузка…</p>
      <p class="muted" id="where"></p>
    </header>

    <input id="search" class="search" type="search" placeholder="Поиск…" autocomplete="off" hidden>
    <ul id="list" class="grid"></ul>
    <p class="empty" id="empty" hidden>Ничего не найдено.</p>
  </div>

<script>
(async () => {
  // ── Настройки ────────────────────────────────────────────────────────────
  // Всё можно оставить null — тогда определится автоматически.
  const CFG = {
    owner: null,        // 'octocat'
    repo:  null,        // 'my-project' или 'octocat.github.io'
    branch: 'HEAD',     // 'main' / 'master' / 'HEAD'
    dir:   null,        // папка от корня репо; null = папка, где лежит этот index.html
    recursive: false,   // false — только файлы из этой папки; true — включая подпапки
  };
  // ─────────────────────────────────────────────────────────────────────────

  const statusEl = document.getElementById('status');
  const whereEl  = document.getElementById('where');
  const searchEl = document.getElementById('search');
  const listEl   = document.getElementById('list');
  const emptyEl  = document.getElementById('empty');

  try {
    const ctx = await detectRepo();
    const files = await loadHtmlFiles(ctx);
    render(files, ctx);
  } catch (e) {
    statusEl.textContent = '';
    const p = document.createElement('p');
    p.className = 'err';
    p.textContent = 'Ошибка: ' + e.message;
    document.querySelector('header').appendChild(p);
    console.error(e);
  }

  // Определяем owner/repo/каталог, в котором лежит этот index.html
  async function detectRepo() {
    const m = location.hostname.match(/^([^.]+)\.github\.io$/i);
    if (!m) {
      if (!CFG.owner || !CFG.repo)
        throw new Error('Это не *.github.io — задайте CFG.owner и CFG.repo вручную.');
    }
    const autoOwner = m ? m[1] : null;

    const owner = CFG.owner || autoOwner;
    const segs  = location.pathname.split('/').filter(Boolean);
    let repo = CFG.repo;
    let rootSegs = 0;

    if (!repo) {
      // project page: /<repo>/...   |   user page: /...
      if (segs.length && await repoExists(owner, segs[0])) {
        repo = segs[0];
        rootSegs = 1;
      } else {
        repo = `${owner}.github.io`;
        rootSegs = 0;
      }
    } else {
      const i = segs.indexOf(repo);
      if (i !== -1) rootSegs = i + 1;
    }

    const here = segs.slice(rootSegs);                 // путь внутри репо, включая index.html
    const dir = CFG.dir !== null
      ? CFG.dir.replace(/^\/+|\/+$/g, '')
      : here.slice(0, -1).join('/');                   // папка текущей страницы

    const currentPath = here.join('/');                // чтобы не ссылаться на себя

    return { owner, repo, dir, branch: CFG.branch, currentPath };
  }

  async function repoExists(owner, repo) {
    const r = await fetch(`https://api.github.com/repos/${owner}/${repo}`, {
      headers: { Accept: 'application/vnd.github+json' }
    });
    return r.ok;
  }

  async function loadHtmlFiles({ owner, repo, dir, branch, currentPath }) {
    const url = `https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`;
    const r = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!r.ok) {
      if (r.status === 403)
        throw new Error('GitHub API rate limit (60/час на IP). Попробуйте позже.');
      throw new Error(`GitHub API ${r.status}: ${await r.text()}`);
    }
    const data = await r.json();
    if (data.truncated) console.warn('Дерево усечено GitHub API — часть файлов может отсутствовать.');

    const prefix = dir ? dir + '/' : '';
    return data.tree
      .filter(t => t.type === 'blob')
      .filter(t => t.path.startsWith(prefix))
      .filter(t => t.path.toLowerCase().endsWith('.html'))
      .filter(t => !/(^|\/)index\.html?$/i.test(t.path))  // игнорируем любые index.html
      .filter(t => t.path !== currentPath)                // и саму текущую страницу
      .filter(t => CFG.recursive || !t.path.slice(prefix.length).includes('/'))
      .sort((a, b) => a.path.localeCompare(b.path, undefined, { numeric: true }));
  }

  function render(files, { dir, owner, repo }) {
    const base = dir ? dir + '/' : '';
    const items = files.map(f => {
      const rel  = f.path.slice(base.length);
      const name = rel.replace(/\.html?$/i, '');
      const cut  = name.lastIndexOf('/');
      return {
        rel,
        name,
        folder: cut === -1 ? '' : name.slice(0, cut)
      };
    });

    whereEl.textContent = `${owner}/${repo}` + (dir ? '/' + dir : '');

    if (!items.length) {
      statusEl.textContent = 'HTML-файлов не найдено.';
      return;
    }

    // ── Панели ──────────────────────────────────────────────
    const frag = document.createDocumentFragment();
    for (const it of items) {
      const li = document.createElement('li');
      li.dataset.search = (it.name + ' ' + it.folder).toLowerCase();

      const a = document.createElement('a');
      a.className = 'card';
      a.href = encodeURI(it.rel);

      const title = document.createElement('span');
      title.className = 'card__title';
      title.textContent = it.name;
      a.appendChild(title);

      if (it.folder) {
        const path = document.createElement('span');
        path.className = 'card__path';
        path.textContent = it.folder + '/';
        a.appendChild(path);
      }

      li.appendChild(a);
      frag.appendChild(li);
    }
    listEl.appendChild(frag);

    // ── Поиск (появляется, когда ссылок становится много) ────
    const total = items.length;
    const setStatus = (shown) => {
      statusEl.textContent = shown === total
        ? `Найдено: ${total}`
        : `Показано: ${shown} из ${total}`;
    };
    setStatus(total);

    if (total > 5) {
      searchEl.hidden = false;
      searchEl.addEventListener('input', () => {
        const q = searchEl.value.trim().toLowerCase();
        let shown = 0;
        for (const li of listEl.children) {
          const hit = !q || li.dataset.search.includes(q);
          li.hidden = !hit;
          if (hit) shown++;
        }
        setStatus(shown);
        emptyEl.hidden = shown > 0;
      });
    }
  }
})();
</script>
</body>
</html>
